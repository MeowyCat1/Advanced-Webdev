<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Registration Page</title>
    <style>
        .card-body {
            padding: 40px;
            * {
            margin: 5px;
            padding: 5px 12px;
            width: 100%;
            }
        }
    </style>
</head>
<body>
    <div style="background-image: url(bg.jpg); width: 100vw; height: 100vh; background-size: cover;" class="d-flex justify-content-center align-items-center">
        <div class="card" style="width: auto;">
            <div class="card-body">
                <h1 class="card-title">Sign Up Now</h1>
                <label for="firstname">First Name:</label>
                <input type="text" class="form-control" id="fistname">
                <label for="surname">Surname:</label>
                <input type="text" class="form-control" id="surname">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="johnsmith@email.org">
                <label for="country">Country:</label>
                <select class="form-select" aria-label="Country Picker" id="country">
                    <option selected>Select A Country</option>
                    <option>United Kingdom</option>
                    <option>France</option>
                    <option>Narnia</option>
                    <option>Vatican City</option>
                    <option>Kanto</option>
                    <option>Hyrule</option>
                    <option>Nether</option>
                    <option>New York City</option>
                    <option>Andorra</option>
                    <option>Roman Empire</option>
                </select>
                <button class="btn btn-primary" style="margin-top: 15px;">Sign Up!</button>
            </div>
        </div>
    </div>
</body>
</html>
