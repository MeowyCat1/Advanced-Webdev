<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Buy Clothing now</title>
    <script src=" https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js "></script>
    <script>
        $(document).ready(function() {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const name = urlParams.get("item")
        $("#title").text(name)
        $("title").text(`Buy ${name}`)
        const imgurl = urlParams.get("imgurl")
        $("img").attr("src", imgurl)
        const desc = urlParams.get("desc")
        $("#desc").text(desc)
        $("strong").text(`From ${urlParams.get("price")}`)
        })
    </script>
</head>
<body>
        <div class="row g-0">
            <div class="col-12 col-sm-8">
                <img src="../Bootstrap Project/img1.jpg", width="100%">
            </div>
            <div class="col-12 p-4 col-sm-4">
                <h1 style="font-size: 30pt;" id="title">Clothing</h1>
                <p id="desc">Very Fancy, very good, amazing lol</p>
                <strong>From £50</strong>
                <button class="btn btn-primary w-100">Buy Now!</button>
            </div>
        </div>
</body>
</html>
