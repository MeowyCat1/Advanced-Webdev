<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>To-Do List</title>
</head>
<body style="background-color: rgb(214, 237, 247); width: 100%;" class="d-flex justify-content-center">
    <div style="align-self: center;" class="card m-5 container">
        <div class="card-body">
            <h2 class="card-title" style="text-align: center; color: rgb(140, 140, 211);">📝To-Do List</h4>
            <div style="text-align: center; width: 100%;">
                <div class="d-flex flex-nowrap"><input id="entry" type="text" class="form-control" style="width: 78%; margin-right: 2%;"><button style="width: 20%;" id="add" class="theme-primary btn-solid" onclick="additem()">Add</button></div>
            </div>
            <ul id="items">

            </ul>
        </div>
    </div>
        <script>
        function additem() {
            console.log("Ran additem")
            let inputbox = document.getElementById("entry")
            let stringtoadd = inputbox.value.trim()
            let li = document.createElement("li")
            li.className = "m-8"
            let span = document.createElement("span")
            let deletebutton = document.createElement("button")
            deletebutton.innerText = "Delete"
            deletebutton.className = "theme-info btn-solid ms-auto"
            deletebutton.onclick = () => {li.remove()}
            let donebutton = document.createElement("button")
            donebutton.innerText = "Done"
            donebutton.className = "theme-info btn-solid ms-auto"
            donebutton.onclick = () => {if (span.crossed==true) {span.crossed = false; span.style = ""} else {span.style = "text-decoration: line-through;"; span.crossed=true}}
            span.innerText = stringtoadd
            span.className="m-8"
            li.appendChild(span)
            li.appendChild(deletebutton)
            li.appendChild(donebutton)
            let ul = document.getElementById("items")
            ul.appendChild(li)
        }
    </script>
</body>
</html>
